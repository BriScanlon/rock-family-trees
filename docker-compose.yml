x-backend-env: &backend-env
  TASK_MODE: ${TASK_MODE:-celery}
  RABBITMQ_URL: ${RABBITMQ_URL:-pyamqp://guest:guest@rftg-rabbitmq//}
  GRAPH_STORE: ${GRAPH_STORE:-neo4j}
  NEO4J_URI: ${NEO4J_URI:-bolt://rftg-neo4j:7687}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-please}
  MB_USER_AGENT: ${MB_USER_AGENT:-RockFamilyTreeGen/2.0 ( https://github.com/BriScanlon/rock-family-trees )}
  # The notes written from Wikipedia (app/narrative.py): a local model through Ollama by default.
  # On Windows/macOS, Ollama runs natively on the host (Docker Desktop can't hand an AMD GPU to a
  # container); on a Linux host with an AMD GPU, `docker compose --profile ollama-rocm up` runs it
  # here instead - then set OLLAMA_URL=http://rftg-ollama:11434.
  NARRATIVE_BACKEND: ${NARRATIVE_BACKEND:-ollama}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-rftg-qwen3}  # qwen3:14b with a 40K context: ollama/Modelfile
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # only for NARRATIVE_BACKEND=anthropic
  ARTIFACT_DIR: /data/artifacts
  CACHE_DIR: /data/cache

services:
  rftg-backend:
    build: ./backend
    container_name: rftg-backend
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]  # the host's Ollama, on Linux too
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - rftg_data:/data
    depends_on:
      rftg-rabbitmq: { condition: service_healthy }
      rftg-neo4j: { condition: service_healthy }
    networks: [rftg-net]

  rftg-worker:
    build: ./backend
    container_name: rftg-worker
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment: *backend-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./backend:/app
      - rftg_data:/data
    depends_on:
      rftg-rabbitmq: { condition: service_healthy }
      rftg-neo4j: { condition: service_healthy }
    networks: [rftg-net]

  rftg-frontend:
    build: ./frontend
    container_name: rftg-frontend
    environment:
      BACKEND_URL: http://rftg-backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on: [rftg-backend]
    networks: [rftg-net]

  rftg-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rftg-rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [rftg-net]

  rftg-neo4j:
    image: neo4j:5-community
    container_name: rftg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-please}
    volumes:
      - rftg_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [rftg-net]

  # Optional: Ollama on an AMD GPU (ROCm), for Linux hosts only. Off unless asked for:
  #   docker compose --profile ollama-rocm up -d
  #   docker exec rftg-ollama ollama pull qwen3:14b
  #   docker cp ollama/Modelfile rftg-ollama:/Modelfile && docker exec rftg-ollama ollama create rftg-qwen3 -f /Modelfile
  rftg-ollama:
    image: ollama/ollama:rocm
    container_name: rftg-ollama
    profiles: ["ollama-rocm"]
    devices: ["/dev/kfd", "/dev/dri"]
    group_add: ["video"]
    volumes:
      - rftg_ollama:/root/.ollama
    networks: [rftg-net]

networks:
  rftg-net:
    driver: bridge

volumes:
  rftg_ollama:
  rftg_data:
  rftg_neo4j_data:
